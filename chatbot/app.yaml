runtime: python39

instance_class: F2

env_variables:
  BUCKET_NAME: "example-gcs-bucket"

handlers:
  - url: /static
    static_dir: static/

  - url: /.*
    secure: always
    redirect_http_response_code: 301
    script: auto

error_handlers:
  - file: default_error.html

  - error_code: over_quota
  - file: over_quota.html
